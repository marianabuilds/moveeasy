function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark ?
      '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)' :
      '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style
    }}>
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)'
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark ?
        'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)' :
        'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)'
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) =>
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>;

  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px'
      }}>
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        )}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted} />
            <circle cx="11" cy="3" r="2.5" fill={muted} />
            <circle cx="19" cy="3" r="2.5" fill={muted} />
          </svg>
        )}
      </div>
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4
      }}>{title}</div>
    </div>
  );
}

function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43
    }}>
      {icon &&
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0
        }} />
      }
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron &&
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      }
      {!isLast &&
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep
        }} />
      }
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>

          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08
        }}>{header}</div>
      }
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden'
      }}>{children}</div>
    </div>
  );
}

function IOSDevice({ children, width = 402, height = 874, dark = false, title, keyboard = false }) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased'
    }}>
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50
      }} />
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>

}

Object.assign(window, { IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow });
</script>

<script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-field{appearance:none;width:100%;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-swatch{appearance:none;-webkit-appearance:none;width:56px;height:22px;
    border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:0;cursor:default;
    background:transparent;flex-shrink:0}
  .twk-swatch::-webkit-color-swatch-wrapper{padding:0}
  .twk-swatch::-webkit-color-swatch{border:0;border-radius:5.5px}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </div>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakColor, TweakText, TweakSelect });
</script>

  { text: "You don't have to be great to start, but you have to start to be great.", author: "Zig Ziglar" },
  { text: "What hurts today makes you stronger tomorrow.", author: "Jay Cutler" },
];

function HomeScreen({ onNavigate, onStartWorkout }) {
  const [muscle, setMuscle] = React.useState('Arms');
  const [intState, setIntState] = React.useState('Moderate');

  const muscles = ['Back', 'Arms', 'Legs', 'Full Body'];
  const intensities = ['Light', 'Moderate', 'Heavy'];
  const quote = QUOTES[new Date().getDay() % QUOTES.length];
  const info = INTENSITY_INFO[intState];
  const exCount = (WORKOUTS[muscle] || []).length;
  const estMin = exCount * (intState === 'Light' ? 5 : intState === 'Heavy' ? 9 : 7);

  return (
    <div style={hs.container}>
      <div style={hs.header}>
        <div style={hs.subtitle}>TODAY'S PLAN</div>
        <div style={{ ...hs.title, fontFamily: '"DM Sans"' }}>

      </div>

      <div style={hs.quoteCard}>
        <div style={hs.quoteBar}></div>
        <div style={hs.quoteInner}>
          <div style={hs.quoteText}>"{quote.text}"</div>
          <div style={hs.quoteAuthor}>— {quote.author}</div>
        </div>
      </div>

      <div style={hs.filterRow}>
        {muscles.map((m) =>
          <div key={m}
            style={{ ...hs.filterChip, ...(muscle === m ? hs.filterChipActive : {}) }}

            {MUSCLE_EMOJI[m]} {m}
          </div>
        )}
      </div>

      <div style={hs.sectionLabel}>INTENSITY</div>
      <div style={hs.intensityRow}>
        {intensities.map((lvl) => {
          const inf = INTENSITY_INFO[lvl];
          const isActive = intState === lvl;
          return (
            <div key={lvl}
              style={{
                ...hs.intChip,
                borderColor: isActive ? inf.color : BORDER,
                background: isActive ? inf.bg : CARD,
                color: isActive ? inf.color : SUB
              }}
              onClick={() => setIntState(lvl)}>
              <div style={{ ...hs.intChipDot, background: isActive ? inf.color : BORDER }}></div>
              {lvl}
            </div>
          );
        })}
      </div>

      <div style={{ ...hs.summaryCard, borderLeftColor: info.color }}>
        <div style={hs.summaryTop}>
          <div>
            <div style={{ ...hs.summaryTitle, fontFamily: '"DM Sans"' }}>{MUSCLE_EMOJI[muscle]} {muscle} — {intState}</div>
            <div style={hs.summaryDesc}>{info.desc}</div>
          </div>
        </div>
        <div style={hs.summaryStats}>
          <div style={hs.sumStat}><span style={hs.sumStatNum}>{exCount}</span><span style={hs.sumStatLabel}> exercises</span></div>
          <div style={hs.sumDot}></div>
          <div style={hs.sumStat}><span style={hs.sumStatNum}>{info.sets}</span></div>
          <div style={hs.sumDot}></div>
          <div style={hs.sumStat}><span style={hs.sumStatNum}>{info.reps}</span></div>
          <div style={hs.sumDot}></div>
          <div style={hs.sumStat}><span style={hs.sumStatNum}>~{estMin} min</span></div>
        </div>
      </div>

      <div style={{ flex: 1 }}></div>

      <div style={hs.ctaWrap}>
        <button style={hs.ctaBtn} onClick={() => onStartWorkout(muscle, 0, intState)}>
          Begin Workout →
        </button>
      </div>
    </div>
  );
}

const hs = {
  container: { background: BG, minHeight: '100vh', display: 'flex', flexDirection: 'column', padding: '60px 60px 40px' },
  header: { marginBottom: 40, flexShrink: 0 },
  subtitle: { fontSize: 12, fontWeight: 700, color: ACC, letterSpacing: '0.1em', marginBottom: 12 },
  title: { fontSize: 40, fontWeight: 800, color: TEXT, letterSpacing: '-0.8px', lineHeight: 1.2, whiteSpace: 'pre-line' },
  quoteCard: { background: '#fff8f4', border: '1px solid #f2ddd3', borderRadius: 14, display: 'flex', alignItems: 'stretch', overflow: 'hidden', marginBottom: 40, flexShrink: 0, maxWidth: '600px' },
  quoteBar: { width: 4, background: ACC, flexShrink: 0 },
  quoteInner: { padding: '16px 18px', flex: 1 },
  quoteText: { fontSize: 14, color: TEXT, fontStyle: 'italic', lineHeight: 1.6, marginBottom: 6 },
  quoteAuthor: { fontSize: 12, color: ACC, fontWeight: 700 },
  sectionLabel: { fontSize: 12, fontWeight: 700, color: SUB, letterSpacing: '0.08em', marginBottom: 12, flexShrink: 0, textTransform: 'uppercase' },
  filterRow: { display: 'flex', gap: 12, marginBottom: 32, flexShrink: 0, flexWrap: 'wrap' },
  filterChip: { padding: '10px 18px', borderRadius: 20, border: `1.5px solid ${BORDER}`, fontSize: 14, fontWeight: 600, color: SUB, background: CARD, cursor: 'pointer', whiteSpace: 'nowrap', transition: 'all 0.2s' },
  filterChipActive: { background: ACC, color: '#fff', borderColor: ACC },
  intensityRow: { display: 'flex', gap: 12, marginBottom: 32, flexShrink: 0 },
  intChip: { flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, padding: '12px 0', borderRadius: 12, borderWidth: '1.5px', borderStyle: 'solid', fontSize: 14, fontWeight: 700, cursor: 'pointer', background: CARD, transition: 'all 0.2s' },
  intChipDot: { width: 8, height: 8, borderRadius: 4 },
  summaryCard: { background: CARD, borderRadius: 16, padding: '20px', borderLeft: `4px solid ${ACC}`, boxShadow: '0 1px 4px rgba(0,0,0,0.07)', flexShrink: 0, maxWidth: '500px' },
  summaryTop: { marginBottom: 16 },
  summaryTitle: { fontSize: 18, fontWeight: 800, color: TEXT, marginBottom: 6 },
  summaryDesc: { fontSize: 14, color: SUB, lineHeight: 1.5 },
  summaryStats: { display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' },
  sumStat: { fontSize: 13, color: TEXT },

  sumDot: { width: 3, height: 3, borderRadius: 2, background: BORDER },

  ctaBtn: { background: ACC, border: 'none', borderRadius: 16, padding: '16px 32px', fontSize: 16, fontWeight: 700, color: '#fff', cursor: 'pointer', transition: 'all 0.2s', maxWidth: '300px' },
};

Object.assign(window, { HomeScreen });
</script>

<script type="text/babel">
function AIRecommendation() {
  const recommendations = [
    "💪 Based on your schedule: Back day is perfect for building strength. Focus on pulling movements.",
    "🔥 Progressive overload: Try adding 5 lbs to your barbell rows this week.",
    "⚡ Rest quality: Ensure 48 hours between back workouts for optimal muscle recovery.",
    "📈 Volume tracking: You've hit 12 workouts this month—keep the momentum!",
    "🎯 Mind-muscle connection: Slow down your reps by 2 seconds for better control.",
  ];
  const rec = recommendations[Math.floor(Math.random() * recommendations.length)];
  return (
    <div style={{ background: '#fff3ec', borderLeft: `4px solid ${ACC}`, borderRadius: 8, padding: '14px 16px', marginBottom: 24, fontSize: 13, color: TEXT, lineHeight: 1.6 }}>
      <strong>💡 AI Trainer Tip:</strong> {rec}
    </div>
  );
}

function LogScreen({ onNavigate, workoutGroup, intensity }) {
  const group = workoutGroup || 'Arms';
  const intLevel = intensity || 'Moderate';
  const exercises = WORKOUTS[group] || WORKOUTS['Arms'];
  const intInfo = INTENSITY_INFO[intLevel] || INTENSITY_INFO['Moderate'];

  const [selectedEx, setSelectedEx] = React.useState(null);
  const [weights, setWeights] = React.useState({});
  const [notes, setNotes] = React.useState({});
  const [timeLeft, setTimeLeft] = React.useState(null);
  const [resting, setResting] = React.useState(false);

  const ex = selectedEx !== null ? exercises[selectedEx] : null;
  const restSecs = parseInt(ex?.rest) || 60;
  const totalSets = intLevel === 'Light' ? 2 : intLevel === 'Heavy' ? 5 : 3;

  React.useEffect(() => {
    if (timeLeft === null || timeLeft <= 0) return;
    const t = setTimeout(() => setTimeLeft((tl) => tl - 1), 1000);
    return () => clearTimeout(t);
  }, [timeLeft]);

  React.useEffect(() => {
    if (timeLeft === 0 && resting) { setResting(false); setTimeLeft(null); }
  }, [timeLeft, resting]);

  const fmt = (s) => {
    const secs = s !== null ? s : restSecs;
    return `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
  };

  if (selectedEx !== null) {
    const exKey = `${group}-${selectedEx}`;
    return (
      <div style={{ background: BG, minHeight: '100vh', display: 'flex', flexDirection: 'column', padding: 'clamp(24px, 5vw, 60px)', maxWidth: '1200px', margin: '0 auto', width: '100%', boxSizing: 'border-box' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 32 }}>
          <div style={{ fontSize: 18, color: TEXT, cursor: 'pointer', fontWeight: 700 }} onClick={() => setSelectedEx(null)}>←</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 'clamp(20px, 6vw, 32px)', fontWeight: 800, color: TEXT }}>{ex?.name}</div>
            <div style={{ fontSize: 14, color: SUB, display: 'flex', alignItems: 'center', gap: 12, marginTop: 4 }}>
              {MUSCLE_EMOJI[group]} {group}
              <span style={{ background: intInfo.bg, color: intInfo.color, borderRadius: 20, padding: '4px 12px', fontSize: 11, fontWeight: 700 }}>{intLevel}</span>
            </div>
          </div>
        </div>

        <iframe
          width="100%"
          height="400"
          src={`https://www.youtube.com/embed/${ex?.youtubeId}?rel=0&modestbranding=1`}
          frameBorder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowFullScreen
          style={{ border: 'none', borderRadius: 12, marginBottom: 32 }}
        ></iframe>

        <div style={{ background: CARD, borderRadius: 16, display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: 0, marginBottom: 32, overflow: 'hidden', boxShadow: '0 1px 4px rgba(0,0,0,0.08)' }}>
          <div style={{ padding: '20px', textAlign: 'center', borderRight: `1px solid ${BORDER}` }}>
            <div style={{ fontSize: 28, fontWeight: 800, color: TEXT }}>{totalSets}</div>
            <div style={{ fontSize: 12, color: SUB, marginTop: 4 }}>Sets</div>
          </div>
          <div style={{ padding: '20px', textAlign: 'center', borderRight: `1px solid ${BORDER}` }}>
            <div style={{ fontSize: 28, fontWeight: 800, color: TEXT }}>{ex?.reps}</div>
            <div style={{ fontSize: 12, color: SUB, marginTop: 4 }}>Reps</div>
          </div>
          <div style={{ padding: '20px', textAlign: 'center' }}>
            <div style={{ fontSize: 28, fontWeight: 800, color: TEXT }}>{ex?.rest}</div>
            <div style={{ fontSize: 12, color: SUB, marginTop: 4 }}>Rest</div>
          </div>
        </div>

        <div style={{ marginBottom: 32 }}>
          <label style={{ fontSize: 13, fontWeight: 700, color: SUB, display: 'block', marginBottom: 8, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Weight Used</label>
          <input
            type="number"
            placeholder="e.g., 135"
            value={weights[exKey] || ''}
            onChange={(e) => setWeights({ ...weights, [exKey]: e.target.value })}
            style={{ width: '100%', padding: '12px 16px', border: `1.5px solid ${BORDER}`, borderRadius: 8, fontSize: 16, fontFamily: 'inherit', boxSizing: 'border-box' }}
          />
        </div>

        <div style={{ marginBottom: 32 }}>
          <label style={{ fontSize: 13, fontWeight: 700, color: SUB, display: 'block', marginBottom: 8, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Notes</label>
          <textarea
            placeholder="How did it feel? Any form cues?"
            value={notes[exKey] || ''}
            onChange={(e) => setNotes({ ...notes, [exKey]: e.target.value })}
            style={{ width: '100%', padding: '12px 16px', border: `1.5px solid ${BORDER}`, borderRadius: 8, fontSize: 14, fontFamily: 'inherit', minHeight: '80px', boxSizing: 'border-box' }}
          />
        </div>

        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', margin: '40px 0' }}>
          <div style={{ fontSize: 'clamp(48px, 15vw, 96px)', fontWeight: 900, color: TEXT, fontVariantNumeric: 'tabular-nums', letterSpacing: '-2px', fontFamily: 'Georgia, serif' }}>
            {fmt(timeLeft)}
          </div>
          <div style={{ fontSize: 16, color: SUB, marginTop: 8 }}>
            {resting ? 'Resting...' : 'Ready to work'}
          </div>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <button style={{ background: intInfo.color, border: 'none', borderRadius: 16, padding: '16px 24px', fontSize: 16, fontWeight: 700, color: '#fff', cursor: 'pointer', width: '100%' }} onClick={() => { setResting(!resting); if (!resting) setTimeLeft(restSecs); }}>
            {resting ? 'Resume Set' : 'Start Rest Timer'}
          </button>
          {resting && <div style={{ textAlign: 'center', fontSize: 14, color: SUB, cursor: 'pointer', padding: '8px 0' }} onClick={() => { setResting(false); setTimeLeft(null); }}>Skip rest</div>}
          <button style={{ background: CARD, border: `1.5px solid ${BORDER}`, borderRadius: 16, padding: '16px 24px', fontSize: 16, fontWeight: 700, color: TEXT, cursor: 'pointer', width: '100%' }} onClick={() => setSelectedEx(null)}>← Back to exercises</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: BG, minHeight: '100vh', display: 'flex', flexDirection: 'column', padding: 'clamp(30px, 5vw, 60px)', maxWidth: '1200px', margin: '0 auto', width: '100%', boxSizing: 'border-box' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 40, flexWrap: 'wrap' }}>
        <div style={{ fontSize: 18, color: TEXT, cursor: 'pointer', fontWeight: 700 }} onClick={() => onNavigate('home')}>← Home</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 'clamp(24px, 6vw, 32px)', fontWeight: 800, color: TEXT }}>{MUSCLE_EMOJI[group]} {group}</div>
          <div style={{ fontSize: 14, color: SUB, marginTop: 4 }}>{intLevel} • {intInfo.sets} • {intInfo.reps}</div>
        </div>
      </div>

      <AIRecommendation />

      <div style={{ border: '1px solid ' + intInfo.color + '44', borderRadius: 12, display: 'flex', alignItems: 'center', overflow: 'hidden', marginBottom: 40, background: intInfo.bg }}>
        <div style={{ width: 4, alignSelf: 'stretch', background: intInfo.color, flexShrink: 0 }}></div>
        <div style={{ padding: '12px 18px', fontSize: 14, color: TEXT, fontWeight: 600 }}>
          <span style={{ color: intInfo.color, fontWeight: 700 }}>{intLevel}</span>
          {' · '}{intInfo.sets} · {intInfo.reps}
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 16 }}>
        {exercises.map((exercise, i) =>
          <div
            key={i}
            style={{ background: CARD, borderRadius: 14, display: 'flex', overflow: 'hidden', boxShadow: '0 1px 4px rgba(0,0,0,0.08)', cursor: 'pointer', transition: 'all 0.2s', border: '2px solid transparent', ':hover': { boxShadow: '0 4px 12px rgba(0,0,0,0.15)' } }}
            onClick={() => setSelectedEx(i)}
            onMouseEnter={(e) => e.currentTarget.style.transform = 'translateY(-2px)'}
            onMouseLeave={(e) => e.currentTarget.style.transform = 'translateY(0)'}
          >
            <div style={{ width: 4, alignSelf: 'stretch', background: intInfo.color, flexShrink: 0 }}></div>
            <div style={{ flex: 1, padding: '20px 18px' }}>
              <div style={{ fontSize: 18, fontWeight: 800, color: TEXT, marginBottom: 6 }}>{exercise.name}</div>
              <div style={{ fontSize: 13, color: SUB, marginBottom: 4 }}>{totalSets} sets × {intLevel === 'Light' ? exercise.reps + 5 : intLevel === 'Heavy' ? Math.max(4, exercise.reps - 4) : exercise.reps} reps</div>
              <div style={{ fontSize: 12, color: SUB, fontWeight: 600 }}>Rest: {exercise.rest}</div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

Object.assign(window, { LogScreen });
</script>

<script type="text/babel">
const TWEAK_DEFAULTS = {
  "accentColor": "#db4200",
  "userName": "Mariana",
  "weightUnit": "kg"
};

function IconToday({ active }) {
  const c = active ? '#d4673a' : '#9e8e7e';
  return (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/>
    </svg>
  );
}

function IconTrain({ active }) {
  const c = active ? '#d4673a' : '#9e8e7e';
  return (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M6 5v14M18 5v14"/>
      <rect x="2" y="8" width="4" height="8" rx="1"/>
      <rect x="18" y="8" width="4" height="8" rx="1"/>
      <line x1="6" y1="12" x2="18" y2="12"/>
    </svg>
  );
}

const TABS = [
  { id: 'home',    label: 'Today',    Icon: IconToday },
  { id: 'log',     label: 'Train',    Icon: IconTrain },
];

function TabBar({ active, onSelect }) {
  return (
    <div style={{ display: 'flex', background: '#fff', borderTop: '1px solid #ede5dc', padding: '12px 0 20px', gap: 40, justifyContent: 'center' }}>
      {TABS.map(({ id, label, Icon }) => (
        <div key={id}
          style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, cursor: 'pointer' }}
          onClick={() => onSelect(id)}
        >
          <Icon active={active === id} />
          <span style={{ fontSize: 12, color: active === id ? '#d4673a' : '#9e8e7e', fontWeight: active === id ? 700 : 500 }}>{label}</span>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [tab, setTab] = React.useState('home');
  const [workoutGroup, setWorkoutGroup] = React.useState('Arms');
  const [startExIdx, setStartExIdx] = React.useState(0);
  const [workoutIntensity, setWorkoutIntensity] = React.useState('Moderate');
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [schedule, setScheduleState] = React.useState(() => {
    try {
      const saved = localStorage.getItem('wt_schedule');
      return saved ? JSON.parse(saved) : DEFAULT_SCHEDULE;
    } catch(e) { return DEFAULT_SCHEDULE; }
  });

  const setSchedule = (s) => {
    setScheduleState(s);
    try { localStorage.setItem('wt_schedule', JSON.stringify(s)); } catch(e) {}
  };

  const handleStartWorkout = (group, exIdx, intensity) => {
    setWorkoutGroup(group);
    setStartExIdx(exIdx || 0);
    setWorkoutIntensity(intensity || 'Moderate');
    setTab('log');
  };

  const renderScreen = () => {
    switch(tab) {
      case 'home': return <HomeScreen onNavigate={setTab} onStartWorkout={handleStartWorkout} schedule={schedule} setSchedule={setSchedule} />;
      case 'log':  return <LogScreen onNavigate={setTab} workoutGroup={workoutGroup} intensity={workoutIntensity} />;
      default:     return <HomeScreen onNavigate={setTab} onStartWorkout={handleStartWorkout} schedule={schedule} setSchedule={setSchedule} />;
    }
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh', background: '#f5ede6' }}>
      <div style={{ flex: 1, overflow: 'auto', position: 'relative' }}>
        {renderScreen()}
      </div>
      <TabBar active={tab} onSelect={setTab} />

      <TweaksPanel title="Tweaks">
        <TweakColor label="Accent Color" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
        <TweakText label="User Name" value={tweaks.userName} onChange={v => setTweak('userName', v)} />
        <TweakSelect
          label="Weight Unit"
          value={tweaks.weightUnit}
          options={[{ label: 'lbs', value: 'lbs' }, { label: 'kg', value: 'kg' }]}
          onChange={v => setTweak('weightUnit', v)}
        />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
