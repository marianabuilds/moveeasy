    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.28s ease forwards; }

    @keyframes bounceDot {
      0%, 80%, 100% { transform: translateY(0);  opacity: 0.35; }
      40%           { transform: translateY(-4px); opacity: 1; }
    }
    .dot { animation: bounceDot 1.4s ease-in-out infinite; display: block; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .pop-in { animation: popIn 0.3s ease forwards; }

    ];

    const Q3_QUESTION = "One last thing — what best describes your move?";

    const Q3_TRANSITION = {
      "solo-local":    "Got it — keeping it lean and focused. Here's your plan.",
      "family":        "Family moves have more pieces to coordinate. Here's what matters most.",
      "long-distance": "Long-distance adds a few extra considerations. Here's your tailored plan.",
      "first-time":    "First move! Here's what first-timers wish they'd known earlier."
    };

    /* ── Icon card data ───────────────────────────────────────────────── */

    const STAGE_CARDS = [
      {
        key: "planning",
        title: "Still Planning",
        sub: "Haven't started yet",
        icon: (
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1"/>
            <line x1="9" y1="12" x2="15" y2="12"/>
            <line x1="9" y1="16" x2="13" y2="16"/>
            <polyline points="9 8 10.5 9.5 13 7"/>
          </svg>
        )
      },
      {
        key: "in-progress",
        title: "Moving Now",
        sub: "It's happening soon",
        icon: (
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <rect x="1" y="3" width="15" height="13"/>
            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
            <circle cx="5.5" cy="18.5" r="2.5"/>
            <circle cx="18.5" cy="18.5" r="2.5"/>
          </svg>
        )
      },
      {
        key: "just-moved",
        title: "Just Moved In",
        sub: "Need to settle in",
        icon: (
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        )
      }
    ];

    const TIMELINE_CARDS = [
      {
        key: "plan-6plus",
        title: "6+ Weeks Out",
        sub: "Plenty of runway",
        icon: (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="1"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <line x1="8" y1="14" x2="8" y2="14" strokeWidth="2.5"/>
            <line x1="12" y1="14" x2="12" y2="14" strokeWidth="2.5"/>
            <line x1="8" y1="18" x2="8" y2="18" strokeWidth="2.5"/>
          </svg>
        )
      },
      {
        key: "plan-2to6",
        title: "2–6 Weeks",
        sub: "Getting close",
        icon: (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        )
      },
      {
        key: "plan-under2",
        title: "Under 2 Weeks",
        sub: "Cutting it close",
        icon: (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        )
      }
    ];

    const COMPLEXITY_CARDS = [
      {
        key: "solo-local",
        title: "Solo / Couple",
        sub: "Local move",
        icon: (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        )
      },
      {
        key: "family",
        title: "Family",
        sub: "Kids or pets",
        icon: (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        )
      },
      {
        key: "long-distance",
        title: "Long Distance",
        sub: "New city or state",
        icon: (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <polygon points="3 11 22 2 13 21 11 13 3 11"/>
          </svg>
        )
      },
      {
        key: "first-time",
        title: "First Timer",
        sub: "Renting on my own",
        icon: (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
        )
      }
    ];

    /* ── Reusable icon card grid ──────────────────────────────────────── */

    function IconCards({ cards, onSelect }) {
      const [picked, setPicked] = useState(null);
      const choose = (key) => {
        if (picked) return;
        setPicked(key);
        onSelect(key);
      };
      const cols = cards.length === 4 ? "grid-cols-2" : "grid-cols-3";
      return (
        <div className={`grid ${cols} gap-2 mt-1 fade-up`}>
          {cards.map(({ key, icon, title, sub }) => (
            <button
              key={key}
              onClick={() => choose(key)}
              disabled={!!picked}
              className={`flex flex-col items-center text-center gap-3 py-5 px-2 border transition-all duration-150
                ${picked === key
                  ? "bg-stone-900 border-stone-900"
                  : picked
                    ? "opacity-20 cursor-default bg-white border-stone-200"
                    : "bg-white border-stone-200 hover:border-stone-700 hover:shadow-sm active:scale-95"
                }`}
            >
              <div className={`transition-colors ${picked === key ? "text-white" : "text-stone-600"}`}>
                {icon}
              </div>
              <div>
                <p className={`text-xs font-semibold leading-tight ${picked === key ? "text-white" : "text-stone-800"}`}>{title}</p>
                <p className={`text-xs mt-0.5 leading-snug ${picked === key ? "text-stone-400" : "text-stone-500"}`}>{sub}</p>
              </div>
            </button>
          ))}
        </div>
      );
    }

    /* ── Small UI pieces ──────────────────────────────────────────────── */

    function Avatar() {
      return (
        <div className="w-7 h-7 rounded-sm bg-stone-900 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">
          M
        </div>
      );
    }

    function TypingBubble() {
      return (
        <div className="flex items-end gap-2.5 fade-up">
          <Avatar />
          <div className="bg-white border border-stone-200 rounded-sm px-4 py-3.5 flex gap-1.5 items-center">
            <span className="dot w-1.5 h-1.5 bg-stone-400 rounded-full" />
            <span className="dot w-1.5 h-1.5 bg-stone-400 rounded-full" />
            <span className="dot w-1.5 h-1.5 bg-stone-400 rounded-full" />
          </div>
        </div>
      );
    }

    function BotBubble({ text }) {
      return (
        <div className="flex items-end gap-2.5 fade-up">
          <Avatar />
          <div className="max-w-xs sm:max-w-sm bg-white border border-stone-200 rounded-sm px-4 py-2.5 text-sm text-stone-800 leading-relaxed">
            {text}
          </div>
        </div>
      );
    }

    function UserBubble({ text }) {
      return (
        <div className="flex justify-end fade-up">
          <div className="max-w-xs sm:max-w-sm bg-stone-900 rounded-sm px-4 py-2.5 text-sm text-white leading-relaxed">
            {text}
          </div>
        </div>
      );
    }

    function ChoiceButtons({ options, onSelect }) {
      const [picked, setPicked] = useState(null);
      const choose = (key) => {
        if (picked) return;
        setPicked(key);
        onSelect(key);
      };
      return (
        <div className="flex flex-wrap gap-2 pl-9 fade-up">
          {options.map(({ key, label }) => (
            <button
              key={key}
              onClick={() => choose(key)}
              disabled={!!picked}
              className={`px-3.5 py-1.5 text-sm font-medium rounded-sm border transition-all
                ${picked === key
                  ? "bg-stone-900 border-stone-900 text-white"
                  : picked
                    ? "bg-white border-stone-200 text-stone-300 cursor-default opacity-40"
                    : "bg-white border-stone-300 text-stone-700 hover:bg-stone-50 hover:border-stone-600 active:scale-95"
                }`}
            >
              {label}
            </button>
          ))}
        </div>
      );
    }

    /* ── Budget estimator ────────────────────────────────────────────── */

    function BudgetEstimator({ complexity }) {
      const [open, setOpen] = useState(false);
      const [br, setBr]     = useState(null);

      const items = BUDGET_ITEMS[complexity];
      if (!items) return null;

      const totalLow  = br !== null ? items.reduce((s, it) => s + it.low[br],  0) : null;
      const totalHigh = br !== null ? items.reduce((s, it) => s + it.high[br], 0) : null;

      return (
        <div className="border-t border-stone-100">
          <button
            onClick={() => setOpen(o => !o)}
            className="w-full flex items-center justify-between px-5 py-3 text-sm text-stone-600 hover:text-stone-900 hover:bg-stone-50 transition-colors"
          >
            <span className="font-medium">Budget estimate</span>
            <span className="text-stone-300 text-xs">{open ? "▲" : "▼"}</span>
          </button>

          {open && (
            <div className="px-5 pb-5 fade-up">
              <p className="text-xs text-stone-400 mb-3">How many bedrooms are you moving from?</p>
              <div className="flex gap-2 mb-4">
                {BR_OPTS.map(({ key, label }) => (
                  <button
                    key={key}
                    onClick={() => setBr(key)}
                    className={`flex-1 py-1.5 text-xs font-medium border transition-all rounded-sm ${
                      br === key
                        ? "bg-stone-900 border-stone-900 text-white"
                        : "bg-white border-stone-300 text-stone-700 hover:border-stone-600"
                    }`}
                  >
                    {label}
                  </button>
                ))}
              </div>

              {br !== null && (
                <div className="fade-up">
                  <div className="flex flex-col gap-2.5">
                    {items.map((item, i) => (
                      <div key={i} className="flex items-center justify-between">
                        <span className="text-xs text-stone-500">{item.label}</span>
                        <span className="text-xs font-medium text-stone-700 tabular-nums">
                          {fmtDollar(item.low[br])} – {fmtDollar(item.high[br])}
                        </span>
                      </div>
                    ))}
                  </div>
                  <div className="mt-3.5 pt-3 border-t border-stone-200 flex items-center justify-between">
                    <span className="text-sm font-semibold text-stone-900">Estimated total</span>
                    <span className="text-sm font-semibold text-stone-900">{fmtDollar(totalLow)} – {fmtDollar(totalHigh)}</span>
                  </div>
                  <p className="text-xs text-stone-400 mt-2.5 leading-relaxed">
                    Typical ranges — actual costs vary by city, season, and what you negotiate. Long-distance totals exclude car shipping if you don't need it.
                  </p>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    /* ── Output card ──────────────────────────────────────────────────── */

    const STORAGE_KEY = "moveeasy_checked";

    function OutputCard({ stage, followUp, complexity, onRestart }) {
      const pathKey = stage === "planning"
        ? `${stage}|${followUp}|${complexity}`
        : `${stage}|${followUp}`;
      const path = PATHS[pathKey];

      const [checked, setChecked] = useState(() => {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          return stored[pathKey] || new Array(path.steps.length).fill(false);
        } catch {
          return new Array(path.steps.length).fill(false);
        }
      });

      const allDone = checked.every(Boolean);

      const toggle = (i) => {
        setChecked(prev => {
          const next = [...prev];
          next[i] = !next[i];
          try {
            const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
            stored[pathKey] = next;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
          } catch {}
          return next;
        });
      };

      return (
        <div className="pl-9 fade-up">
          <div className="bg-white border border-stone-200 overflow-hidden pop-in">

            {/* Header */}
            <div className="bg-stone-900 px-5 py-4 text-white">
              <p className="text-stone-500 text-xs uppercase tracking-widest font-medium mb-1">Action Plan</p>
              <h2 className="text-xl font-semibold leading-tight">{path.title}</h2>
            </div>

            {/* Context message */}
            <div className="px-5 pt-4 pb-4 border-b border-stone-100">
              <p className="text-stone-500 text-sm leading-relaxed">{path.context}</p>
            </div>

            {/* Steps */}
            <div className="px-5 pt-4 pb-5">
              <div className="flex items-center gap-2 mb-4">
                <p className="text-xs uppercase tracking-widest text-stone-400 font-medium">Steps</p>
                <span className="bg-stone-100 text-stone-500 text-xs font-medium rounded-sm px-1.5 py-0.5">
                  {path.steps.length}
                </span>
              </div>
              <div className="flex flex-col gap-3.5">
                {path.steps.map((step, i) => (
                  <button key={i} onClick={() => toggle(i)} className="flex items-start gap-3 text-left group w-full">
                    <div className={`w-4 h-4 rounded-sm border flex-shrink-0 mt-0.5 flex items-center justify-center transition-all duration-150
                      ${checked[i]
                        ? "bg-stone-900 border-stone-900"
                        : "border-stone-300 group-hover:border-stone-600"
                      }`}
                    >
                      {checked[i] && (
                        <svg className="w-2.5 h-2.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
                          <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                      )}
                    </div>
                    <span className={`text-sm leading-relaxed transition-colors ${
                      checked[i] ? "line-through text-stone-400" : "text-stone-700 group-hover:text-stone-900"
                    }`}>
                      {step}
                    </span>
                  </button>
                ))}
              </div>

              {allDone && (
                <div className="mt-5 py-3 px-4 bg-stone-50 border border-stone-200 text-center fade-up">
                  <p className="text-stone-700 font-medium text-sm">All done. You've got this. 🎉</p>
                </div>
              )}
            </div>

            {/* Budget estimator */}
            <BudgetEstimator complexity={complexity} />

            {/* Restart */}
            <div className="border-t border-stone-100 px-5 py-3">
              <button
                onClick={onRestart}
                className="text-xs text-stone-400 hover:text-stone-700 transition-colors w-full text-center"
              >
                ↩ Start over
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ── Main chat app ────────────────────────────────────────────────── */

    let _id = 0;
    const uid = () => ++_id;

    function App({ onRestart }) {
      const [msgs,       setMsgs]       = useState([]);
      const [typing,     setTyping]     = useState(false);
      const [phase,      setPhase]      = useState("init");
      const [stage,      setStage]      = useState(null);
      const [followUp,   setFollowUp]   = useState(null);
      const [complexity, setComplexity] = useState(null);
      const bottomRef = useRef(null);

      const add = (msg) => setMsgs(prev => [...prev, { id: uid(), ...msg }]);

      /* Opening sequence */
      useEffect(() => {
        setTyping(true);
        const t1 = setTimeout(() => {
          add({ type: "bot", text: "Hey! I'm MoveEasy. 👋 I'm going to help you cut through the chaos and figure out exactly what to do next." });
        }, 700);
        const t2 = setTimeout(() => {
          add({ type: "bot", text: "It'll only take a couple of quick questions — then I'll give you a personalized action plan." });
        }, 1500);
        const t3 = setTimeout(() => {
          setTyping(false);
          add({ type: "bot", text: "First: where are you in your move right now?" });
          setPhase("q1");
        }, 2300);
        return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
      }, []);

      /* Always scroll to bottom */
      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: "smooth" });
      });

      const handleStage = (stageKey) => {
        if (phase !== "q1") return;
        setPhase("q1-answered");
        setStage(stageKey);
        add({ type: "user", text: Q1_OPTIONS.find(o => o.key === stageKey).label });
        setTyping(true);
        setTimeout(() => {
          setTyping(false);
          add({ type: "bot", text: Q1_RESPONSES[stageKey] });
        }, 900);
        setTimeout(() => {
          add({ type: "bot", text: Q1_FOLLOWUP_QUESTION[stageKey] });
          setPhase("q2");
        }, 1700);
      };

      const handleFollowUp = (key) => {
        if (phase !== "q2") return;
        setPhase("q2-answered");
        setFollowUp(key);
        add({ type: "user", text: Q2_OPTIONS[stage].find(o => o.key === key).label });
        setTyping(true);
        if (stage === "planning") {
          setTimeout(() => {
            setTyping(false);
            add({ type: "bot", text: "Almost there — one more quick question to make this even more specific." });
          }, 900);
          setTimeout(() => {
            add({ type: "bot", text: Q3_QUESTION });
            setPhase("q3");
          }, 1700);
        } else {
          setTimeout(() => {
            setTyping(false);
            add({ type: "bot", text: Q2_TRANSITION[stage] });
          }, 900);
          setTimeout(() => setPhase("done"), 1700);
        }
      };

      const handleComplexity = (key) => {
        if (phase !== "q3") return;
        setPhase("q3-answered");
        setComplexity(key);
        add({ type: "user", text: Q3_OPTIONS.find(o => o.key === key).label });
        setTyping(true);
        setTimeout(() => {
          setTyping(false);
          add({ type: "bot", text: Q3_TRANSITION[key] });
        }, 900);
        setTimeout(() => setPhase("done"), 1700);
      };

      return (
        <div className="min-h-screen flex flex-col">

          {/* Chat header */}
          <div className="sticky top-0 z-10 bg-white border-b border-stone-200">
            <div className="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
              <div className="w-8 h-8 rounded-sm bg-stone-900 flex items-center justify-center text-white font-bold text-sm">
                M
              </div>
              <div>
                <h1 className="font-semibold text-stone-900 text-sm leading-none mb-0.5">MoveEasy</h1>
                <p className="text-xs text-emerald-500 font-medium">● Online</p>
              </div>
              <div className="ml-auto">
                <span className="text-xs text-stone-400 font-medium">Your personal move planner</span>
              </div>
            </div>
          </div>

          {/* Messages */}
          <div className="flex-1 max-w-lg mx-auto w-full px-4 py-6 flex flex-col gap-3">

            {msgs.map(msg =>
              msg.type === "bot"
                ? <BotBubble key={msg.id} text={msg.text} />
                : <UserBubble key={msg.id} text={msg.text} />
            )}

            {typing && <TypingBubble />}

            {phase === "q1" && (
              <IconCards cards={STAGE_CARDS} onSelect={handleStage} />
            )}

            {phase === "q2" && stage && stage === "planning" && (
              <IconCards cards={TIMELINE_CARDS} onSelect={handleFollowUp} />
            )}

            {phase === "q2" && stage && stage !== "planning" && (
              <ChoiceButtons options={Q2_OPTIONS[stage]} onSelect={handleFollowUp} />
            )}

            {phase === "q3" && (
              <IconCards cards={COMPLEXITY_CARDS} onSelect={handleComplexity} />
            )}

            {phase === "done" && stage && followUp && (
              <OutputCard stage={stage} followUp={followUp} complexity={complexity} onRestart={onRestart} />
            )}

            <div ref={bottomRef} />
          </div>
        </div>
      );
    }

    /* ── Root wrapper handles restart via key remount ─────────────────── */
    function Root() {
      const [key, setKey] = useState(0);
      return <App key={key} onRestart={() => { _id = 0; setKey(k => k + 1); }} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
