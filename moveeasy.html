<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoveEasy</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    *, body { font-family: 'Inter', system-ui, sans-serif; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.35s ease forwards; }

    @keyframes bounceDot {
      0%, 80%, 100% { transform: translateY(0);  opacity: 0.4; }
      40%           { transform: translateY(-5px); opacity: 1;   }
    }
    .dot { animation: bounceDot 1.4s ease-in-out infinite; display: block; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes popIn {
      0%   { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }
    .pop-in { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  </style>
</head>
<body class="bg-purple-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ── Data ─────────────────────────────────────────────────────────── */

    const PATHS = {
      "planning|plan-6plus": {
        title: "Early Mover Advantage",
        context: "You've got the most valuable thing in a move: time. Use these weeks strategically so future-you shows up calm and prepared.",
        steps: [
          "Give written move-out notice to your current landlord now — most leases require 30–60 days, and missing this deadline can cost you your deposit.",
          "Set your move date and lock in a moving company or truck rental — popular weekends and end-of-month dates book up 4–6 weeks out.",
          "Create a moving budget that covers deposits, movers or truck, packing supplies, and a buffer for surprises.",
          "Start a declutter pass — one room at a time. What you donate or sell now is one less thing to pack, move, and unpack.",
          "Research utility providers at your new address: electric, gas, internet. Some require 2–3 week lead times for setup appointments.",
          "Start collecting free boxes from liquor stores, bookstores, and Buy Nothing groups — this takes longer than it sounds.",
          "Notify your employer's HR if you need to update your work address for payroll or tax purposes.",
          "If you have kids or pets, plan their move-day logistics now — who is watching them and where."
        ]
      },
      "planning|plan-2to6": {
        title: "Getting Ready",
        context: "You're in the sweet spot — enough time to do this right without rushing. Your job this week is to convert plans into confirmed bookings.",
        steps: [
          "If you haven't booked movers or a truck, do it today — this is your last comfortable window.",
          "Start the USPS mail forwarding process at usps.com — it takes 7–10 business days to activate.",
          "Schedule utility transfers: give electric, gas, and water your new address and exact start date.",
          "Schedule internet installation at the new place — providers often have 1–2 week wait times for appointments.",
          "Pack non-essential items now: books, out-of-season clothes, decor, extra linens.",
          "Label every box with contents and destination room — future-you will be deeply grateful.",
          "Confirm your move-in date and key pickup logistics with your landlord or building manager in writing.",
          "Back up important documents (lease, IDs, insurance cards) digitally or in a folder you carry personally on move day."
        ]
      },
      "planning|plan-under2": {
        title: "Sprint Mode",
        context: "The runway is short, so we're prioritizing ruthlessly. Focus on what breaks everything if it's not done — everything else can wait.",
        steps: [
          "Book movers or a truck today, even if options are limited — whatever is available beats doing it alone.",
          "Start USPS mail forwarding immediately at usps.com — every day of delay is a day your mail goes to the wrong address.",
          "Pack one full room today. Start with the room you use least.",
          "Call your utility providers now to schedule cutoff at the old address and start at the new one.",
          "Schedule internet installation at the new address — explain you need the earliest possible slot.",
          "Pack a 'move-day essentials' bag you will NOT put in the truck: phone charger, medications, one change of clothes, toiletries, important documents.",
          "Confirm all logistics with your landlord in writing — key handoff time, parking for the truck, elevator reservations if applicable."
        ]
      },
      "in-progress|ip-this-week": {
        title: "Final Countdown",
        context: "You're in the thick of it. Here's your prioritized list to close out cleanly and land in the new place without chaos.",
        steps: [
          "Finish packing room by room — kitchen and bathroom last since you still need them.",
          "Confirm your movers or truck reservation for the exact date, time, and address.",
          "If you haven't started USPS mail forwarding, do it right now — it takes 7–10 days to activate and the clock is running.",
          "Call or log in to transfer electric, gas, and water to your new address with your exact move-in date.",
          "Schedule or confirm internet installation at the new address.",
          "Set aside a 'first night box' that goes in your car, not the truck: bedding, towel, phone chargers, toiletries, snacks, and a change of clothes.",
          "Take photos of your current apartment — every room, every wall, every appliance — before the movers arrive. This is your deposit protection.",
          "Clean as you finish packing each room rather than leaving it all for the end."
        ]
      },
      "in-progress|ip-moving-day": {
        title: "Moving Day Mode",
        context: "It's go time. Stop planning and start executing — here's the exact sequence for today.",
        steps: [
          "Load the truck heaviest items first: furniture, appliances, large boxes. Light and fragile items on top.",
          "Keep your 'essentials bag' in your personal car, not the truck — it goes with you no matter what.",
          "Do a final walk-through of every room, closet, cabinet, and outdoor space before the truck leaves.",
          "Take timestamped photos of every room, wall scuff, and appliance at the old place before you hand over keys.",
          "Return all keys, fobs, mailbox keys, and parking passes — and get written or text confirmation from your landlord.",
          "At the new place, set up your bedroom and bathroom first — you need a functioning place to sleep and shower before anything else matters.",
          "Locate the nearest grocery store and pharmacy before it gets dark.",
          "Do not try to unpack everything tonight. Settle in, eat something real, and make a plan for tomorrow."
        ]
      },
      "just-moved|jm-admin": {
        title: "Close Out the Paperwork",
        context: "The move is done but your address update trail is still incomplete. Here's everything you need to officially 'arrive' in your new home.",
        steps: [
          "Update your driver's license address at your state's DMV — most states require this within 10–30 days of moving.",
          "Update your voter registration at vote.gov — this takes 5 minutes and is easy to forget.",
          "If you haven't activated USPS mail forwarding yet, do it today at usps.com.",
          "Update your address with your bank(s) and credit card companies — log in to each one and change it in profile settings.",
          "Update your address with your employer's HR or payroll system.",
          "Notify your health insurance provider and any other insurance carriers (auto, life) of your new address.",
          "Update your Amazon, Apple, Google Pay, and any subscription service delivery addresses.",
          "File an address change with the IRS if you've moved since your last tax filing — use Form 8822."
        ]
      },
      "just-moved|jm-utilities": {
        title: "Get the Basics Running",
        context: "You shouldn't have to think about whether your lights will turn on or your renter's insurance is active. Let's close these out.",
        steps: [
          "Confirm your electric and gas accounts are in your name at the new address — call or log in to verify.",
          "If internet is not set up yet, book an installation appointment today — this is the one that takes the longest.",
          "Get renter's insurance if you don't have it — it typically costs $15–$20/month and covers everything in your apartment.",
          "Check whether your water and trash are included in rent or need to be set up separately (ask your landlord if unsure).",
          "Locate your circuit breaker, water shut-off valve, and building's emergency maintenance number — know these before you need them.",
          "Test your smoke detectors and CO detectors. If they're not working, notify your landlord in writing.",
          "Set up automatic payments for rent if your landlord accepts them — eliminates one recurring stressor."
        ]
      },
      "just-moved|jm-settling": {
        title: "Make It Feel Like Home",
        context: "The logistics are handled — now it's about turning a space full of boxes into somewhere you actually want to be.",
        steps: [
          "Unpack your bedroom completely first — sleep quality matters more than any other room.",
          "Set up your kitchen next: dishes, coffee maker, a few pantry staples. Having a functional kitchen changes everything.",
          "Break down and recycle or dispose of boxes as you empty them — clutter makes the place feel unsettled longer.",
          "Introduce yourself to at least one neighbor this week — knowing one person on your floor makes the place feel less anonymous.",
          "Find your nearest coffee shop, grocery store, park, and gym — even one exploratory walk helps the neighborhood click.",
          "Hang at least one thing on a wall. A blank wall in every room is what makes a place feel like a rental.",
          "If you have a storage unit or garage, resist putting 'unsorted boxes' there — go through them now while you still remember what's in them."
        ]
      }
    };

    const Q1_OPTIONS = [
      { key: "planning",    label: "Still planning — haven't started yet" },
      { key: "in-progress", label: "Actively moving — it's happening soon" },
      { key: "just-moved",  label: "Just moved in — I need to get settled" }
    ];

    const Q2_OPTIONS = {
      "planning": [
        { key: "plan-6plus",  label: "More than 6 weeks away" },
        { key: "plan-2to6",   label: "2–6 weeks away" },
        { key: "plan-under2", label: "Under 2 weeks — cutting it close" }
      ],
      "in-progress": [
        { key: "ip-this-week",  label: "This week (1–5 days)" },
        { key: "ip-moving-day", label: "Tomorrow or today 😅" }
      ],
      "just-moved": [
        { key: "jm-admin",     label: "Administrative stuff (DMV, mail, voter reg)" },
        { key: "jm-utilities", label: "Utilities and services (internet, electric, renter's insurance)" },
        { key: "jm-settling",  label: "Just getting the place set up and feeling like home" }
      ]
    };

    const Q1_RESPONSES = {
      "planning":    "Love that you're thinking ahead — that's genuinely the best time to do this. Let me ask one more thing.",
      "in-progress": "Okay, crunch time! Let's make sure nothing falls through the cracks.",
      "just-moved":  "Congrats on the new place! Now let's knock out everything still on your to-do list."
    };

    const Q1_FOLLOWUP_QUESTION = {
      "planning":    "How far out is your move date?",
      "in-progress": "How soon is moving day?",
      "just-moved":  "What's the biggest thing still hanging over you?"
    };

    const Q2_TRANSITION = {
      "planning":    "Here's your game plan — built for exactly where you are.",
      "in-progress": "Alright, here's your focused priority list. Let's go.",
      "just-moved":  "Got it. Here's what to knock out this week."
    };

    /* ── Small UI pieces ──────────────────────────────────────────────── */

    function Avatar() {
      return (
        <div className="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-purple-700 flex items-center justify-center text-white text-sm font-bold flex-shrink-0 shadow-sm">
          M
        </div>
      );
    }

    function TypingBubble() {
      return (
        <div className="flex items-end gap-2 fade-up">
          <Avatar />
          <div className="bg-white border border-purple-100 shadow-sm rounded-2xl rounded-bl-none px-4 py-3.5 flex gap-1.5 items-center">
            <span className="dot w-2 h-2 bg-purple-400 rounded-full" />
            <span className="dot w-2 h-2 bg-purple-400 rounded-full" />
            <span className="dot w-2 h-2 bg-purple-400 rounded-full" />
          </div>
        </div>
      );
    }

    function BotBubble({ text }) {
      return (
        <div className="flex items-end gap-2 fade-up">
          <Avatar />
          <div className="max-w-xs sm:max-w-sm bg-white border border-purple-100 shadow-sm rounded-2xl rounded-bl-none px-4 py-2.5 text-sm text-gray-800 leading-relaxed">
            {text}
          </div>
        </div>
      );
    }

    function UserBubble({ text }) {
      return (
        <div className="flex justify-end fade-up">
          <div className="max-w-xs sm:max-w-sm bg-purple-600 rounded-2xl rounded-br-none px-4 py-2.5 text-sm text-white leading-relaxed shadow-sm">
            {text}
          </div>
        </div>
      );
    }

    function ChoiceButtons({ options, onSelect }) {
      const [picked, setPicked] = useState(null);
      const choose = (key) => {
        if (picked) return;
        setPicked(key);
        onSelect(key);
      };
      return (
        <div className="flex flex-wrap gap-2 pl-10 fade-up">
          {options.map(({ key, label }) => (
            <button
              key={key}
              onClick={() => choose(key)}
              disabled={!!picked}
              className={`px-4 py-2 text-sm font-medium rounded-full border transition-all
                ${picked === key
                  ? "bg-purple-600 border-purple-600 text-white shadow"
                  : picked
                    ? "bg-white border-purple-100 text-purple-300 cursor-default opacity-50"
                    : "bg-white border-purple-200 text-purple-700 hover:bg-purple-50 hover:border-purple-400 shadow-sm active:scale-95"
                }`}
            >
              {label}
            </button>
          ))}
        </div>
      );
    }

    /* ── Output card ──────────────────────────────────────────────────── */

    const STORAGE_KEY = "moveeasy_checked";

    function OutputCard({ stage, followUp, onRestart }) {
      const pathKey = `${stage}|${followUp}`;
      const path = PATHS[pathKey];

      const [checked, setChecked] = useState(() => {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          return stored[pathKey] || new Array(path.steps.length).fill(false);
        } catch {
          return new Array(path.steps.length).fill(false);
        }
      });

      const allDone = checked.every(Boolean);

      const toggle = (i) => {
        setChecked(prev => {
          const next = [...prev];
          next[i] = !next[i];
          try {
            const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
            stored[pathKey] = next;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
          } catch {}
          return next;
        });
      };

      return (
        <div className="pl-10 fade-up">
          <div className="bg-white rounded-2xl rounded-tl-none border border-purple-100 shadow-md overflow-hidden pop-in">

            {/* Header */}
            <div className="bg-gradient-to-r from-purple-600 to-purple-700 px-5 py-4 text-white">
              <p className="text-purple-300 text-xs uppercase tracking-widest font-semibold mb-1">Your Action Plan</p>
              <h2 className="text-2xl font-bold leading-tight">{path.title}</h2>
            </div>

            {/* Context message */}
            <div className="mx-5 mt-4 mb-3 bg-purple-50 rounded-xl px-4 py-3 border border-purple-100">
              <p className="text-gray-700 text-sm leading-relaxed">{path.context}</p>
            </div>

            {/* Steps */}
            <div className="px-5 pb-4">
              <div className="flex items-center gap-2 mb-3">
                <p className="text-xs uppercase tracking-widest text-purple-400 font-semibold">Your action plan</p>
                <span className="bg-purple-100 text-purple-600 text-xs font-semibold rounded-full px-2 py-0.5">
                  {path.steps.length} steps
                </span>
              </div>
              <div className="flex flex-col gap-3.5">
                {path.steps.map((step, i) => (
                  <button key={i} onClick={() => toggle(i)} className="flex items-start gap-3 text-left group w-full">
                    <div className={`w-5 h-5 rounded-full border-2 flex-shrink-0 mt-0.5 flex items-center justify-center transition-all duration-200
                      ${checked[i]
                        ? "bg-purple-600 border-purple-600"
                        : "border-purple-300 group-hover:border-purple-500 group-hover:bg-purple-50"
                      }`}
                    >
                      {checked[i] && (
                        <svg className="w-2.5 h-2.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3.5}>
                          <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                      )}
                    </div>
                    <span className={`text-sm leading-relaxed transition-colors ${
                      checked[i] ? "line-through text-gray-400" : "text-gray-700 group-hover:text-purple-900"
                    }`}>
                      {step}
                    </span>
                  </button>
                ))}
              </div>

              {allDone && (
                <div className="mt-4 py-2.5 px-4 bg-purple-50 rounded-xl text-center fade-up">
                  <p className="text-purple-700 font-semibold text-sm">You're absolutely crushing it! 🎉</p>
                </div>
              )}
            </div>

            {/* Restart */}
            <div className="border-t border-purple-50 px-5 py-3">
              <button
                onClick={onRestart}
                className="text-xs text-purple-400 hover:text-purple-600 transition-colors w-full text-center"
              >
                ↩ Start over
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ── Main chat app ────────────────────────────────────────────────── */

    let _id = 0;
    const uid = () => ++_id;

    function App({ onRestart }) {
      const [msgs,    setMsgs]    = useState([]);
      const [typing,  setTyping]  = useState(false);
      const [phase,   setPhase]   = useState("init");
      const [stage,   setStage]   = useState(null);
      const [followUp, setFollowUp] = useState(null);
      const bottomRef = useRef(null);

      const add = (msg) => setMsgs(prev => [...prev, { id: uid(), ...msg }]);

      /* Opening sequence */
      useEffect(() => {
        setTyping(true);
        const t1 = setTimeout(() => {
          add({ type: "bot", text: "Hey! I'm MoveEasy. 👋 I'm going to help you cut through the chaos and figure out exactly what to do next." });
        }, 700);
        const t2 = setTimeout(() => {
          add({ type: "bot", text: "It'll only take two quick questions — then I'll give you a personalized action plan." });
        }, 1500);
        const t3 = setTimeout(() => {
          setTyping(false);
          add({ type: "bot", text: "First: where are you in your move right now?" });
          setPhase("q1");
        }, 2300);
        return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
      }, []);

      /* Always scroll to bottom */
      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: "smooth" });
      });

      const handleStage = (stageKey) => {
        if (phase !== "q1") return;
        setPhase("q1-answered");
        setStage(stageKey);
        add({ type: "user", text: Q1_OPTIONS.find(o => o.key === stageKey).label });
        setTyping(true);
        setTimeout(() => {
          setTyping(false);
          add({ type: "bot", text: Q1_RESPONSES[stageKey] });
        }, 900);
        setTimeout(() => {
          add({ type: "bot", text: Q1_FOLLOWUP_QUESTION[stageKey] });
          setPhase("q2");
        }, 1700);
      };

      const handleFollowUp = (key) => {
        if (phase !== "q2") return;
        setPhase("q2-answered");
        setFollowUp(key);
        add({ type: "user", text: Q2_OPTIONS[stage].find(o => o.key === key).label });
        setTyping(true);
        setTimeout(() => {
          setTyping(false);
          add({ type: "bot", text: Q2_TRANSITION[stage] });
        }, 900);
        setTimeout(() => setPhase("done"), 1700);
      };

      return (
        <div className="min-h-screen flex flex-col bg-gradient-to-b from-purple-50 to-white">

          {/* Chat header */}
          <div className="sticky top-0 z-10 bg-white border-b border-purple-100 shadow-sm">
            <div className="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 to-purple-700 flex items-center justify-center text-white font-bold text-base shadow">
                M
              </div>
              <div>
                <h1 className="font-semibold text-gray-900 text-sm leading-none mb-0.5">MoveEasy</h1>
                <p className="text-xs text-green-500 font-medium">● Online</p>
              </div>
              <div className="ml-auto">
                <span className="text-xs text-purple-300 font-medium">Your personal move planner</span>
              </div>
            </div>
          </div>

          {/* Messages */}
          <div className="flex-1 max-w-lg mx-auto w-full px-4 py-5 flex flex-col gap-3">

            {msgs.map(msg =>
              msg.type === "bot"
                ? <BotBubble key={msg.id} text={msg.text} />
                : <UserBubble key={msg.id} text={msg.text} />
            )}

            {typing && <TypingBubble />}

            {phase === "q1" && (
              <ChoiceButtons options={Q1_OPTIONS} onSelect={handleStage} />
            )}

            {phase === "q2" && stage && (
              <ChoiceButtons options={Q2_OPTIONS[stage]} onSelect={handleFollowUp} />
            )}

            {phase === "done" && stage && followUp && (
              <OutputCard stage={stage} followUp={followUp} onRestart={onRestart} />
            )}

            <div ref={bottomRef} />
          </div>
        </div>
      );
    }

    /* ── Root wrapper handles restart via key remount ─────────────────── */
    function Root() {
      const [key, setKey] = useState(0);
      return <App key={key} onRestart={() => { _id = 0; setKey(k => k + 1); }} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
